services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: webhook-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: webhook-kafka-exporter
    depends_on:
      - kafka
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:9092"

  prometheus:
    image: prom/prometheus:latest
    container_name: webhook-prometheus
    depends_on:
      - kafka-exporter
      - alertmanager
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: webhook-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: webhook-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: webhook-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  
  postgres:
    image: postgres:16
    container_name: webhook-postgres
    environment:
      POSTGRES_DB: fb_api_db
      POSTGRES_USER: fb_api_user
      POSTGRES_PASSWORD: fb_api_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  webhook-service:
    build: ./webhook-service
    container_name: webhook-service
    depends_on:
      - kafka
    env_file:
      - ./.env
    environment:
      PORT: 3001
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: webhook-service
    ports:
      - "3001:3001"
    restart: unless-stopped

  core-service:
    build: ./core-service
    container_name: core-service
    depends_on:
      - kafka
    env_file:
      - ./.env
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: core-service
    volumes:
      - ./core-service/data:/app/data
    restart: unless-stopped

  backend-api:
    build: ./backend-api
    container_name: backend-api
    depends_on:
      - kafka
    env_file:
      - ./.env
    environment:
      BACKEND_PORT: 3000
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: backend-api
    ports:
      - "3000:3000"
    volumes:
      - ./backend-api/data:/app/data
    restart: unless-stopped

  retry-service:
    build: ./retry-service
    container_name: retry-service
    depends_on:
      - kafka
    env_file:
      - ./.env
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: retry-service
    restart: unless-stopped
volumes:
  postgres_data:
  prometheus_data: